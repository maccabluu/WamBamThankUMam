<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080813">
  <title>Wam Bam Thank U Mam</title>
  <link rel="preload" as="image" href="level1_bg.webp">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="level1.css">
</head>
<body>
<div id="app">
  <section id="homeScreen" class="screen active">
    <div class="night-city"></div>
    <div class="halftone top-dots"></div>

    <div class="home-topbar">
      <button class="avatar-button" data-action="profile" aria-label="Profile">
        <span class="avatar-face">💋</span><span class="level-star">25</span>
      </button>
      <button class="pill heart-pill" data-action="lives"><span class="heart-icon">♥</span><b id="homeLives">5</b><span>FULL</span><i>+</i></button>
      <button class="pill coin-pill" data-action="coins"><span class="coin">$</span><b id="homeCoins">12,450</b><i>+</i></button>
      <button class="vip-button" data-action="vip">♛ <b>VIP</b></button>
    </div>

    <div class="home-logo burst-logo" aria-label="Wam Bam Thank U Mam">
      <span class="home-wam">WAM</span>
      <span class="home-bam">BAM</span>
      <span class="home-thank">THANK U MAM</span>
    </div>

    <div class="neon-sign left-neon"><small>The</small><b>BAM</b><span>LOUNGE</span><i>➜</i></div>
    <div class="neon-sign right-neon"><b>Good<br>Vibes</b><span>Big<br>Combos!</span></div>

    <div class="pinup home-pinup" aria-hidden="true">
      <div class="bow"><i></i><i></i></div>
      <div class="hair back"></div>
      <div class="head"><span class="eye left"></span><span class="eye right wink"></span><span class="mouth"></span></div>
      <div class="hair front"></div>
      <div class="earring left"></div><div class="earring right"></div>
      <div class="body"></div>
      <div class="mic">🎙️</div>
    </div>

    <div class="jukebox" aria-hidden="true"><div class="jukebox-glow"></div><b>♫</b></div>
    <div class="milkshake" aria-hidden="true">🍒<span>🥤</span></div>

    <button id="playButton" class="play-button">★ <b>PLAY</b> ★</button>

    <nav class="home-nav">
      <button data-action="events"><span>🗓️</span><b>EVENTS</b><em>!</em></button>
      <button data-action="shop"><span>🛍️</span><b>SHOP</b></button>
      <button data-action="challenges"><span>🏆</span><b>CHALLENGES</b></button>
      <button data-action="settings"><span>⚙️</span><b>SETTINGS</b></button>
    </nav>

    <button class="reward-banner" data-action="events"><strong>BOOM!</strong><span>PLAY EVENTS<br><b>WIN BIG REWARDS!</b></span><i>🪙 🎁 💣</i></button>
  </section>

  <section id="gameScreen" class="screen level-one-screen">
    <img class="level-one-bg" src="level1_bg.webp" alt="" draggable="false" aria-hidden="true">

    <div class="level-one-hud" aria-live="polite">
      <div class="moves-live"><b id="movesValue">16</b></div>
      <aside class="target-live" aria-label="Level targets">
        <div><span class="target-icon cherry-mini">●●</span><b id="targetCherries">30</b></div>
        <div><span class="target-icon diamond-mini">◆</span><b id="targetDiamond">18</b></div>
        <div><span class="target-icon star-mini">★</span><b id="targetStar">20</b></div>
      </aside>
    </div>

    <div id="boardFrame" class="board-frame level-one-board-frame">
      <div id="board" class="board level-one-board" aria-label="11 by 11 match three board"></div>
    </div>

    <div id="bamFlash" class="bam-flash">WAM!</div>

    <div class="boosters level-one-boosters" aria-label="Power ups">
      <button class="booster" data-booster="rocket" aria-label="Lip Laser"><i id="rocketCount">3</i></button>
      <button class="booster" data-booster="hammer" aria-label="Heel Smash"><i id="hammerCount">3</i></button>
      <button class="booster" data-booster="disco" aria-label="Disco Ball"><i id="discoCount">3</i></button>
      <button class="booster" data-booster="swap" aria-label="Swap"><i id="swapCount">3</i></button>
      <button id="pauseButton" class="pause-button" aria-label="Pause">PAUSE</button>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modalTitle">WAM!</h2>
      <p id="modalText"></p>
      <button id="modalPrimary">OK</button>
      <button id="modalClose" class="secondary">CLOSE</button>
    </div>
  </div>
</div>
<script src="game11.js"></script>
</body>
</html>
