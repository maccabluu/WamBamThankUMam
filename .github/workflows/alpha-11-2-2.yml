name: Wam Bam Alpha 11.2.2 Board + Transparent Boosters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-2-2.yml'
      - 'release-tools/alpha-11.2.2/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-2-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify patch source and Android SDK
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.2.2/gameplay-1122.js
          test -f release-tools/alpha-11.2.2/prepare.py
          node --check release-tools/alpha-11.2.2/gameplay-1122.js
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download exact signed 11.2.1 production base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.2.1/WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk
          echo '84cc8a89b2dd6edac935b121876165fd2ed4c22ac02f9b8bcd22fcb79679b6ef  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          test -f work/assets/www/gameplay-112.js
          test -f work/assets/www/gameplay-1121.js
          test -f work/assets/www/wam-campaign.js
          test -f work/assets/www/wam-ui.js

      - name: Apply 11.2.2 gameplay polish
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.2.2/prepare.py work/assets/www

      - name: Verify visual patch
        run: |
          set -euo pipefail
          node --check work/assets/www/gameplay-1122.js
          grep -Fq '<script src="gameplay-1122.js"></script>' work/assets/www/index.html
          grep -Fq 'width:580px' work/assets/www/gameplay-1122.js
          grep -Fq 'height:580px' work/assets/www/gameplay-1122.js
          grep -Fq 'background:transparent' work/assets/www/gameplay-1122.js
          grep -Fq 'width:128px' work/assets/www/gameplay-1122.js

      - name: Set Android release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>112002',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.2.2',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.2.2-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "Missing Wam Bam signing secret: $value"; exit 1; }
          done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.2.2-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/zipalign" -c 4 WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk
          "$BT/aapt" dump badging WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='112002' versionName='11.2.2'" package.txt
          unzip -p WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk assets/www/gameplay-1122.js | grep -Fq 'width:580px'
          sha256sum WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.2.2-Larger-Board-Transparent-Boosters
          path: |
            WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.2.2
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.2.2
          name: Wam Bam Alpha 11.2.2 - Larger Board + Transparent Boosters
          prerelease: true
          body: |
            Follow-up visual update based on the latest BlueStacks screenshot.

            Changes:
            - Level 1 board enlarged again to 580x580 so the actual game area is clearly bigger.
            - Board moved left/up slightly to use more of the centre of the screen.
            - Board cells made slightly more transparent so the Bam Lounge scene still shows through.
            - Booster tray made more transparent.
            - Booster cards made semi-transparent instead of using large white panels.
            - Microphone, heel and disco ball artwork enlarged to 128x96 and displayed on transparent backgrounds.
            - Free Swap symbol enlarged and kept transparent.
            - Labels and quantity badges kept readable.
            - Real match-3 engine, Level 1 goals, saves and campaign progression retained.

            Identity checks:
            - Package: com.macca.wambamthankumam
            - Android versionCode: 112002
            - Version: 11.2.2
            - Permanent signing certificate unchanged.

            CI verifies build, package and signature. Final visual/touch behaviour still needs confirmation in BlueStacks/Android.
          files: |
            WamBam_Alpha_11.2.2_Larger_Board_Transparent_Boosters.apk
            SHA256SUMS.txt
