name: Publish Wam Bam Alpha 8.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpha-8-1.yml"
      - "release-tools/alpha-8.1/**"
      - "release-tools/alpha-8.0/code2.patch"
      - "release-tools/alpha-8.0/background.b64"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools, apktool and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          curl -L --fail --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Build Alpha 8.1.1 black-screen recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          java -jar apktool.jar d -f downloads/alpha-7.9.0/WamBam_Alpha_7.9.0_Events_And_Navigation.apk -o work

          python3 - <<'PY'
          from pathlib import Path
          import re

          yml = Path('work/apktool.yml')
          s = yml.read_text()
          s, n1 = re.subn(r'(?m)^(\s*versionCode:\s*)\S+\s*$', r'\g<1>80101', s, count=1)
          s, n2 = re.subn(r'(?m)^(\s*versionName:\s*).+\s*$', r'\g<1>8.1.1', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not update Android version fields to 8.1.1')
          yml.write_text(s)

          data = Path('work/assets/www/data.js')
          ds = data.read_text()
          if '"version":"7.9.0"' not in ds:
              raise SystemExit('7.9.0 project version marker not found')
          data.write_text(ds.replace('"version":"7.9.0"','"version":"8.1.1"',1))
          PY

          patch work/assets/www/code2.js < release-tools/alpha-8.0/code2.patch

          # Recover from the broken/truncated Alpha 8.1 WebP using the last verified
          # gameplay artwork, then rebuild it at 2160x3840 with Lanczos scaling and sharpening.
          base64 -d release-tools/alpha-8.0/background.b64 > game_background_81_source.jpg
          test -s game_background_81_source.jpg
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 game_background_81_source.jpg
          ffmpeg -hide_banner -loglevel error -y -i game_background_81_source.jpg -vf "scale=2160:3840:flags=lanczos,unsharp=5:5:0.85:5:5:0.0" -q:v 1 work/assets/www/game_background_81.jpg

          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/assets/www/code2.js')
          s = p.read_text()
          for old in [
              'game_background_new.jpg',
              'game_background_81.webp',
              'level_1_background.png',
              'level_2_background.png',
              'level_3_background.png',
              'level_4_background.png',
              'level_5_background.png',
          ]:
              s = s.replace(old, 'game_background_81.jpg')
          if s.count('background: "game_background_81.jpg"') < 5:
              raise SystemExit('All five level backgrounds were not assigned')
          p.write_text(s)
          PY

          node --check work/assets/www/code2.js
          grep -q 'const ROWS = 11' work/assets/www/code2.js
          grep -q 'const COLS = 8' work/assets/www/code2.js
          test "$(grep -o 'background: \"game_background_81.jpg\"' work/assets/www/code2.js | wc -l)" -ge 5
          grep -q 'versionCode: 80101' work/apktool.yml
          grep -q 'versionName: 8.1.1' work/apktool.yml
          test -s work/assets/www/game_background_81.jpg

          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 work/assets/www/game_background_81.jpg)"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 work/assets/www/game_background_81.jpg)"
          echo "Gameplay background dimensions: ${WIDTH}x${HEIGHT}"
          test "$WIDTH" = "2160"
          test "$HEIGHT" = "3840"

          java -jar apktool.jar b work -o WamBam_Alpha_8.1.1_Background_Hotfix-unsigned.apk

          unzip -l WamBam_Alpha_8.1.1_Background_Hotfix-unsigned.apk | tee apk-files.txt
          grep -q 'assets/www/game_background_81.jpg' apk-files.txt

      - name: Sign with permanent Wam Bam key and verify update identity
        shell: bash
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: required signing secret $v is missing"
              exit 1
            fi
          done

          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "$WB_KEYSTORE_B64" | base64 -d > wam-bam-release.keystore

          EXPECTED="D0:4C:06:9C:47:D1:64:2C:83:24:3D:E6:81:E6:2B:FD:1A:5C:99:68:16:AB:0C:7B:15:DE:A8:2A:91:33:8A:D1"
          ACTUAL="$(keytool -list -v -keystore wam-bam-release.keystore -storepass "$WB_KEYSTORE_PASSWORD" -alias "$WB_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -1)"
          echo "Keystore SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          "$BT/zipalign" -f 4 WamBam_Alpha_8.1.1_Background_Hotfix-unsigned.apk WamBam_Alpha_8.1.1_Background_Hotfix-aligned.apk
          "$BT/apksigner" sign --ks wam-bam-release.keystore --ks-pass "pass:$WB_KEYSTORE_PASSWORD" --ks-key-alias "$WB_KEY_ALIAS" --key-pass "pass:$WB_KEY_PASSWORD" --out WamBam_Alpha_8.1.1_Background_Hotfix.apk WamBam_Alpha_8.1.1_Background_Hotfix-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_8.1.1_Background_Hotfix.apk | tee verify.txt
          grep -qi 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1' verify.txt

          "$BT/aapt" dump badging WamBam_Alpha_8.1.1_Background_Hotfix.apk | tee badging.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='80101' versionName='8.1.1'" badging.txt

          sha256sum WamBam_Alpha_8.1.1_Background_Hotfix.apk > WamBam_Alpha_8.1.1_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-8.1.1-APK
          path: |
            WamBam_Alpha_8.1.1_Background_Hotfix.apk
            WamBam_Alpha_8.1.1_SHA256SUMS.txt
            badging.txt
            verify.txt
            apk-files.txt

      - name: Publish verified Alpha 8.1.1 hotfix release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.1.1
          name: Wam Bam Alpha 8.1.1 Background Hotfix
          prerelease: true
          body: |
            Alpha 8.1.1 background hotfix

            - Fixes the black gameplay screen from Alpha 8.1.0.
            - Rebuilds the gameplay background as a real 2160 x 3840 JPEG.
            - Uses the gameplay artwork on Levels 1 to 5.
            - Keeps the 8 x 11 match grid, targets, pieces and boosters.
            - Uses the permanent Wam Bam Android signing key for update compatibility.
          files: |
            WamBam_Alpha_8.1.1_Background_Hotfix.apk
            WamBam_Alpha_8.1.1_SHA256SUMS.txt
