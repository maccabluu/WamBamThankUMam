name: Wam Bam Alpha 11.5.8 Booster Number Optical Alignment

on:
  push:
    branches: [wam-11.5.8]
    paths:
      - '.github/workflows/alpha-11-5-8.yml'
      - 'release-tools/alpha-11.5.8/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-5-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wam-11.5.8

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 11.5.8 patch sources
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.5.8/prepare.py
          test -f release-tools/alpha-11.5.8/counter-optical-1158.js
          node --check release-tools/alpha-11.5.8/counter-optical-1158.js
          grep -Fq "hammer:{x:135,y:107}" release-tools/alpha-11.5.8/counter-optical-1158.js
          grep -Fq "rocket:{x:261,y:108}" release-tools/alpha-11.5.8/counter-optical-1158.js
          grep -Fq "swap:{x:388,y:109}" release-tools/alpha-11.5.8/counter-optical-1158.js
          grep -Fq "disco:{x:514,y:109}" release-tools/alpha-11.5.8/counter-optical-1158.js
          grep -Fq "jukebox:{x:640,y:109}" release-tools/alpha-11.5.8/counter-optical-1158.js
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download signed Alpha 11.5.7 production lineage
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.5.7/WamBam_Alpha_11.5.7_Booster_Counts.apk
          echo '134e28c63b78e701c02b5a9126ed4e6cdab388cd0610128fe179faeb8ccd2a5b  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1154.js background-1155.js layout-1156.js counter-align-1157.js; do
            test -f "work/assets/www/$f"
            cp "work/assets/www/$f" "$f.before"
          done
          unzip -p base.apk assets/www/artwork/booster-bar-reference-1132.png > booster-bar-before.png
          echo '631962144a0a1b1b55bd33ee9957cf130f21baf3fff11270564babe9e687b360  booster-bar-before.png' | sha256sum -c -

      - name: Apply Levels 11-100 booster number alignment
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.5.8/prepare.py work/assets/www

      - name: Verify production gameplay remains unchanged
        run: |
          set -euo pipefail
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1154.js background-1155.js layout-1156.js counter-align-1157.js; do
            cmp -s "$f.before" "work/assets/www/$f"
          done
          node --check work/assets/www/counter-optical-1158.js
          grep -Fq '<script src="counter-optical-1158.js"></script>' work/assets/www/index.html
          grep -Fq "hammer:{x:135,y:107}" work/assets/www/counter-optical-1158.js
          grep -Fq "rocket:{x:261,y:108}" work/assets/www/counter-optical-1158.js
          grep -Fq "swap:{x:388,y:109}" work/assets/www/counter-optical-1158.js
          grep -Fq "disco:{x:514,y:109}" work/assets/www/counter-optical-1158.js
          grep -Fq "jukebox:{x:640,y:109}" work/assets/www/counter-optical-1158.js

      - name: Set Android version 11.5.8
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>115008',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.5.8',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.5.8-unsigned.apk

      - name: Sign permanently and inspect packaged APK
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do
            test -n "${!value:-}" || exit 1
          done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.5.8-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='115008' versionName='11.5.8'" package.txt
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1154.js background-1155.js layout-1156.js counter-align-1157.js; do
            unzip -p WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk "assets/www/$f" > "$f.packaged"
            cmp -s "$f.before" "$f.packaged"
          done
          unzip -p WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk assets/www/counter-optical-1158.js > counter-optical-1158-packaged.js
          node --check counter-optical-1158-packaged.js
          grep -Fq "hammer:{x:135,y:107}" counter-optical-1158-packaged.js
          grep -Fq "jukebox:{x:640,y:109}" counter-optical-1158-packaged.js
          unzip -p WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk assets/www/artwork/booster-bar-reference-1132.png > booster-bar-packaged.png
          echo '631962144a0a1b1b55bd33ee9957cf130f21baf3fff11270564babe9e687b360  booster-bar-packaged.png' | sha256sum -c -
          sha256sum WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.5.8-Production
          path: |
            WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.5.8
        if: github.ref == 'refs/heads/wam-11.5.8'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.5.8
          target_commitish: wam-11.5.8
          name: Wam Bam Alpha 11.5.8 - Booster Number Alignment
          prerelease: true
          body: |
            Levels 11-100 booster number placement adjustment built directly from signed Alpha 11.5.7.

            The BlueStacks screenshot showed the live numbers sitting too high inside the five pink count circles.

            This build:
            - moves the five live numbers down into the visual centres of the existing artwork circles
            - applies individual horizontal positions based on the booster strip artwork
            - keeps Hammer, Mic Blast, Shuffle, Spotlight and Jukebox inventory values unchanged
            - leaves the booster strip artwork and its screen position unchanged
            - leaves Level 10 untouched
            - leaves campaign, boards, targets, moves, blockers, saves and progression unchanged
            - keeps package com.macca.wambamthankumam
            - keeps the permanent signing certificate
            - sets version 11.5.8, versionCode 115008

            Build, signature and packaged-file checks pass in CI. BlueStacks runtime confirmation is still required before calling the number placement resolved.
          files: |
            WamBam_Alpha_11.5.8_Booster_Number_Alignment.apk
            SHA256SUMS.txt
