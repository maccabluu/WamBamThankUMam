name: Build Unity Android Alpha 0.5

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unity-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Unity-Library-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-Android-

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.3.17f1
          targetPlatform: Android
          buildName: WamBamThankUMam-Alpha-0.5
          allowDirtyBuild: true

      - name: Upload Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: WamBamThankUMam-Unity-Alpha-0.5-APK
          path: build/Android
          if-no-files-found: error
          retention-days: 30
