name: Wam Bam Alpha 11.0.3

on:
  push:
    branches: [main, 'update/alpha-11.0.3-background']
    paths: ['release-tools/alpha-11.0.3/**', '.github/workflows/alpha-11-0-3.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam1103-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify and unpack the supplied Alpha 11.0.2 base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.0.2/WamBam_Alpha_11.0.2_Lights_Guide_And_Locks.apk
          echo '15f73537d9b4f0e4fc041130ae9005f5bb4a91f73acf113ab265bc2955289aa5  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          python3 release-tools/alpha-11.0.3/prepare.py work/assets/www
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>110003',p.read_text(),count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.0.3',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY
          for file in work/assets/www/wam-*.js work/assets/www/code{0,1,2,3}.js; do node --check "$file"; done
      - name: Check screens and touch controls
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node release-tools/alpha-11.0.3/tests/screens.cjs work/assets/www screen-checks
          rm -f work/assets/www/integration-check.html
      - name: Build Android APK
        run: |
          sdkmanager 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.0.3-unsigned.apk
      - name: Sign with the existing Wam Bam identity
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "Missing existing signing secret: $value"; exit 1; }
          done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.0.3-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.0.3_New_Level_Background.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.0.3_New_Level_Background.apk > signature.txt
          grep -qi 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1' signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)" = "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          "$BT/zipalign" -c 4 WamBam_Alpha_11.0.3_New_Level_Background.apk
          "$BT/aapt" dump badging WamBam_Alpha_11.0.3_New_Level_Background.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='110003' versionName='11.0.3'" package.txt
          sha256sum WamBam_Alpha_11.0.3_New_Level_Background.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WamBam-11.0.3-checks
          path: |
            screen-checks
            signature.txt
            package.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.0.3-APK
          path: |
            WamBam_Alpha_11.0.3_New_Level_Background.apk
            SHA256SUMS.txt
          retention-days: 7
      - name: Publish the verified update
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.0.3
          name: Wam Bam Alpha 11.0.3 - New Lounge Level Background
          prerelease: true
          body_path: release-tools/alpha-11.0.3/RELEASE_NOTES.md
          files: |
            WamBam_Alpha_11.0.3_New_Level_Background.apk
            SHA256SUMS.txt
