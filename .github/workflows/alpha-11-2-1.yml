name: Wam Bam Alpha 11.2.1 Gameplay Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-2-1.yml'
      - 'release-tools/alpha-11.2.1/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-2-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify patch source and Android SDK
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.2.1/gameplay-1121.js
          test -f release-tools/alpha-11.2.1/prepare.py
          node --check release-tools/alpha-11.2.1/gameplay-1121.js
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download exact signed 11.2.0 production base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.2.0/WamBam_Alpha_11.2.0_Level_1_Prototype.apk
          echo 'df5bc7ad4b38a64520bb0651c41810657201d37edf68c307513c2a2081d3b197  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          test -f work/assets/www/gameplay-112.js
          test -f work/assets/www/wam-campaign.js
          test -f work/assets/www/wam-ui.js

      - name: Apply 11.2.1 gameplay polish
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.2.1/prepare.py work/assets/www

      - name: Verify visual patch
        run: |
          set -euo pipefail
          node --check work/assets/www/gameplay-1121.js
          grep -Fq '<script src="gameplay-1121.js"></script>' work/assets/www/index.html
          grep -Fq 'width:520px' work/assets/www/gameplay-1121.js
          grep -Fq 'height:520px' work/assets/www/gameplay-1121.js
          grep -Fq 'width:112px' work/assets/www/gameplay-1121.js
          grep -Fq 'wam112-booster-tray' work/assets/www/gameplay-1121.js

      - name: Set Android release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>112001',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.2.1',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.2.1-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "Missing Wam Bam signing secret: $value"; exit 1; }
          done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.2.1-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/zipalign" -c 4 WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk
          "$BT/aapt" dump badging WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='112001' versionName='11.2.1'" package.txt
          unzip -p WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk assets/www/gameplay-1121.js | grep -Fq 'width:520px'
          sha256sum WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.2.1-Bigger-Board-Boosters
          path: |
            WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.2.1
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.2.1
          name: Wam Bam Alpha 11.2.1 - Bigger Board + Clearer Boosters
          prerelease: true
          body: |
            Visual polish update based on the BlueStacks Level 1 test screenshot.

            Changes:
            - Level 1 board enlarged from 456x456 to 520x520 and moved slightly upward/left for better use of the gameplay area.
            - Board title widened to match the larger board.
            - Bottom booster tray tightened vertically.
            - Booster cards made clearer with much larger 112x94 icon panels.
            - Microphone, heel and disco ball artwork is easier to see.
            - Free Swap symbol enlarged.
            - Booster labels and quantity badges remain readable.
            - Real match-3 engine, Level 1 goals, saves and campaign progression are retained.

            Identity checks:
            - Package: com.macca.wambamthankumam
            - Android versionCode: 112001
            - Version: 11.2.1
            - Permanent signing certificate unchanged.

            CI verifies build, package and signature. Final visual/touch behaviour still needs confirmation in BlueStacks/Android.
          files: |
            WamBam_Alpha_11.2.1_Bigger_Board_Boosters.apk
            SHA256SUMS.txt
