name: Wam Bam Alpha 11.3.6 Exact Booster Count Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-3-6.yml'
      - 'release-tools/alpha-11.3.6/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-3-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify patch source and Android SDK
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.3.6/gameplay-1136.js
          test -f release-tools/alpha-11.3.6/prepare.py
          node --check release-tools/alpha-11.3.6/gameplay-1136.js
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download exact signed 11.3.5 production base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.3.5/WamBam_Alpha_11.3.5_Booster_Dot_Stray_Fix.apk
          echo '219f07dec70eacec4ccf49117eef145406a2ed7b143ab1e3d8b83087c611b2d5  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          test -f work/assets/www/gameplay-1135.js
          test -f work/assets/www/gameplay-1134.js
          test -f work/assets/www/artwork/booster-bar-reference-1132.png
          test -f work/assets/www/artwork/wambam-level1-bg.jpg
          cp work/assets/www/wam-campaign.js campaign-before.js

      - name: Apply exact booster count and oval mask fix
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.3.6/prepare.py work/assets/www

      - name: Verify UI-only patch and preserved gameplay
        run: |
          set -euo pipefail
          node --check work/assets/www/gameplay-1136.js
          grep -Fq '<script src="gameplay-1136.js"></script>' work/assets/www/index.html
          grep -Fq "hammer:{left:137,top:1082}" work/assets/www/gameplay-1136.js
          grep -Fq 'wam1136-clean-mask' work/assets/www/gameplay-1136.js
          grep -Fq 'top:1110px' work/assets/www/gameplay-1136.js
          grep -Fq 'wam1134-count{display:none' work/assets/www/gameplay-1136.js
          cmp campaign-before.js work/assets/www/wam-campaign.js

      - name: Set Android release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>113006',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.3.6',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.3.6-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do test -n "${!value:-}" || exit 1; done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.3.6-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='113006' versionName='11.3.6'" package.txt
          unzip -p WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk assets/www/wam-campaign.js > campaign-packaged.js
          cmp campaign-before.js campaign-packaged.js
          unzip -p WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk assets/www/gameplay-1136.js > packaged-gameplay.js
          grep -Fq 'wam1136-clean-mask' packaged-gameplay.js
          grep -Fq 'top:1082' packaged-gameplay.js
          unzip -p WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk assets/www/index.html | grep -Fq '<script src="gameplay-1136.js"></script>'
          sha256sum WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.3.6-Exact-Booster-Count-Fix
          path: |
            WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.3.6
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.3.6
          name: Wam Bam Alpha 11.3.6 - Exact Booster Count Fix
          prerelease: true
          body: |
            Fixes the two remaining Level 2-9 booster-bar problems shown in BlueStacks.

            Changes:
            - Hides the old 11.3.4/11.3.5 count elements completely.
            - Draws fresh live white inventory numbers directly over the printed pink booster dots, shifted upward to the measured dot centres.
            - Uses a hard background mask over the exact bottom-right stray-oval area, then redraws the booster strip above it so the magenta oval cannot show through.
            - Keeps the larger Level 2-9 boards and fitted GOALS panels.
            - Keeps Level 1 unchanged.

            Preserved exactly:
            - wam-campaign.js is byte-for-byte identical to signed 11.3.5.
            - Level 2-9 board shapes, rows/columns, targets, move counts, blockers and gameplay definitions remain unchanged.
            - Saves and progression are retained.

            Identity:
            - Package: com.macca.wambamthankumam
            - Android versionCode: 113006
            - Version: 11.3.6
            - Permanent signing certificate unchanged.

            Build/package/signature/campaign invariants are verified in CI. BlueStacks visual confirmation is still required.
          files: |
            WamBam_Alpha_11.3.6_Exact_Booster_Count_Fix.apk
            SHA256SUMS.txt
