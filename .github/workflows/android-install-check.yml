name: Android installation checks

on:
  push:
    branches: ['fix/alpha-9.4-install']
    paths: ['.github/workflows/android-install-check.yml', 'release-tools/android-check/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [25, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Download and inspect the exact published APKs
        run: |
          set -euo pipefail
          mkdir -p install-checks
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v9.3.0/WamBam_Alpha_9.3.0_Lenovo_Tab_P12_Pro_6x10.apk
          curl -fL --retry 3 -o current.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v9.4.0/WamBam_Alpha_9.4.0_Levels_6_to_9.apk
          echo '0a445187308aade8da545df8480e01a9d1672c956772e6309d790f50bb19a4c5  base.apk' | sha256sum -c -
          echo '53b1cc8c16f5224d19c00a93eeff09518c681449b34f65a42f8a5157a5c00af4  current.apk' | sha256sum -c -
          sdkmanager 'build-tools;35.0.0'
          for apk in base current; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk.apk" > "install-checks/$apk-signature.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk.apk" > "install-checks/$apk-package.txt"
            jarsigner -verify "$apk.apk" > "install-checks/$apk-jar-signature.txt" 2>&1 || true
          done
      - name: Enable Android virtual machine acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installation and launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          script: python3 release-tools/android-check/install.py base.apk current.apk install-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-install-API-${{ matrix.api }}
          path: install-checks
          retention-days: 7
