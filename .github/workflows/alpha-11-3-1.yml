name: Wam Bam Alpha 11.3.1 Exact Booster Bar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-3-1.yml'
      - 'release-tools/alpha-11.3.1/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-3-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify patch source and Android SDK
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.3.1/gameplay-1131.js
          test -f release-tools/alpha-11.3.1/prepare.py
          test -f release-tools/alpha-11.3.1/booster-bar-reference.jpg
          test "$(stat -c%s release-tools/alpha-11.3.1/booster-bar-reference.jpg)" -gt 100000
          node --check release-tools/alpha-11.3.1/gameplay-1131.js
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download exact signed 11.3.0 production base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.3.0/WamBam_Alpha_11.3.0_Reference_Booster_Bar.apk
          echo 'a0b76fc64457719b96d52e6a4e34803eb223fd42518eca139c08c6a43cea9600  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          test -f work/assets/www/gameplay-1130.js

      - name: Apply 11.3.1 exact booster bar
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.3.1/prepare.py work/assets/www

      - name: Verify exact booster patch
        run: |
          set -euo pipefail
          node --check work/assets/www/gameplay-1131.js
          grep -Fq '<script src="gameplay-1131.js"></script>' work/assets/www/index.html
          grep -Fq "BAR_SRC='artwork/booster-bar-reference-1131.jpg'" work/assets/www/gameplay-1131.js
          grep -Fq "top','994px'" work/assets/www/gameplay-1131.js
          grep -Fq "opacity','0'" work/assets/www/gameplay-1131.js
          test "$(stat -c%s work/assets/www/artwork/booster-bar-reference-1131.jpg)" -gt 100000
          grep -Fq "square:['#########','#########','#########','#########','#########','#########','#########','#########']" work/assets/www/wam-campaign.js

      - name: Set Android release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>113001',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.3.1',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.3.1-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do test -n "${!value:-}" || exit 1; done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.3.1-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.3.1_Exact_Booster_Bar.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.3.1_Exact_Booster_Bar.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.3.1_Exact_Booster_Bar.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='113001' versionName='11.3.1'" package.txt
          sha256sum WamBam_Alpha_11.3.1_Exact_Booster_Bar.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.3.1-Exact-Booster-Bar
          path: |
            WamBam_Alpha_11.3.1_Exact_Booster_Bar.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.3.1
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.3.1
          name: Wam Bam Alpha 11.3.1 - Exact Booster Bar
          prerelease: true
          body: |
            Booster-bar replacement using the user's supplied reference artwork itself.

            Changes:
            - Replaces the generated four-card booster UI with the supplied booster-bar artwork.
            - Uses the exact HAMMER / MIC BLAST / SHUFFLE / SPOTLIGHT / JUKEBOX visual style from the reference.
            - Removes the visible inventory numbers from the reference artwork and hides the live count badges.
            - Moves the booster bar upward so the complete image stays on-screen.
            - Keeps transparent working hit areas over Hammer, Mic Blast, Shuffle and Spotlight so the existing booster functions remain usable.
            - Jukebox remains visual-only in this build because the current game has four live booster actions.
            - Keeps the 9-column Level 1 board, HUD, girl visibility, saves and campaign progression.

            Identity checks:
            - Package: com.macca.wambamthankumam
            - Android versionCode: 113001
            - Version: 11.3.1
            - Permanent signing certificate unchanged.

            CI verifies build, package, signature, asset inclusion and runtime patch presence. BlueStacks visual confirmation is still required.
          files: |
            WamBam_Alpha_11.3.1_Exact_Booster_Bar.apk
            SHA256SUMS.txt
