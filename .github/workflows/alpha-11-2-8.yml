name: Wam Bam Alpha 11.2.8 Premium Boosters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-2-8.yml'
      - 'release-tools/alpha-11.2.8/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-2-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify patch source and Android SDK
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.2.8/gameplay-1128.js
          test -f release-tools/alpha-11.2.8/prepare.py
          for f in booster-mic-1128.svg booster-heel-1128.svg booster-disco-1128.svg booster-swap-1128.svg; do test -f "release-tools/alpha-11.2.8/$f"; grep -Fq '<svg' "release-tools/alpha-11.2.8/$f"; done
          node --check release-tools/alpha-11.2.8/gameplay-1128.js
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download exact signed 11.2.7 production base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.2.7/WamBam_Alpha_11.2.7_Heel_9_Column_Board.apk
          echo 'ce8a3989edfb1908ebc6b77854d2e34d52314956a679e4ad96aba1cce6056eca  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          test -f work/assets/www/gameplay-1126.js

      - name: Apply 11.2.8 premium booster update
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.2.8/prepare.py work/assets/www

      - name: Verify booster patch
        run: |
          set -euo pipefail
          node --check work/assets/www/gameplay-1128.js
          grep -Fq '<script src="gameplay-1128.js"></script>' work/assets/www/index.html
          grep -Fq 'booster-mic-1128.svg' work/assets/www/gameplay-1128.js
          grep -Fq 'booster-heel-1128.svg' work/assets/www/gameplay-1128.js
          grep -Fq 'booster-disco-1128.svg' work/assets/www/gameplay-1128.js
          grep -Fq 'booster-swap-1128.svg' work/assets/www/gameplay-1128.js
          for f in booster-mic-1128.svg booster-heel-1128.svg booster-disco-1128.svg booster-swap-1128.svg; do test -f "work/assets/www/icons/$f"; done
          grep -Fq "square:['#########','#########','#########','#########','#########','#########','#########','#########']" work/assets/www/wam-campaign.js

      - name: Set Android release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>112008',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.2.8',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.2.8-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do test -n "${!value:-}" || exit 1; done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.2.8-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.2.8_Premium_Boosters.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.2.8_Premium_Boosters.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.2.8_Premium_Boosters.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='112008' versionName='11.2.8'" package.txt
          sha256sum WamBam_Alpha_11.2.8_Premium_Boosters.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.2.8-Premium-Boosters
          path: |
            WamBam_Alpha_11.2.8_Premium_Boosters.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.2.8
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.2.8
          name: Wam Bam Alpha 11.2.8 - Premium Boosters
          prerelease: true
          body: |
            Level 1 booster-bar polish based on the supplied visual reference.

            Changes:
            - Rebuilds the four working booster cards in a deeper glossy burgundy/gold style.
            - Makes all booster artwork substantially larger and easier to recognise.
            - Moves the quantity badges to the lower-right of each icon area like the reference.
            - Uses bold white labels with stronger shadows for readability.
            - Adds refreshed transparent artwork for Mic Blast, Heel Smash, Disco Ball and Free Swap.
            - Disco Ball now displays an actual glowing disco-ball graphic instead of the previous Wam Bam logo artwork.
            - Keeps the 9-column Level 1 board, current HUD, girl visibility and existing booster functionality.

            Identity checks:
            - Package: com.macca.wambamthankumam
            - Android versionCode: 112008
            - Version: 11.2.8
            - Permanent signing certificate unchanged.

            CI verifies build, package, signature, assets and the 9-column board. BlueStacks visual testing still needs user confirmation.
          files: |
            WamBam_Alpha_11.2.8_Premium_Boosters.apk
            SHA256SUMS.txt
