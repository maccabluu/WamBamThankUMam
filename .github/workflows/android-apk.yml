name: Inspect Real Wam Bam APK

on:
  workflow_dispatch:
  push:
    branches:
      - level1-apk-8-0
    paths-ignore:
      - "inspection_level1.txt"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: level1-apk-8-0

      - name: Inspect real GDevelop source and APK
        shell: bash
        run: |
          set -e
          rm -rf /tmp/wambam /tmp/wambam_apk
          mkdir -p /tmp/wambam /tmp/wambam_apk
          unzip -q downloads/alpha-7.9.0/WamBam_GDevelop_Alpha_7.9.0_Events_And_Navigation_Source.zip -d /tmp/wambam
          unzip -q downloads/alpha-7.9.0/WamBam_Alpha_7.9.0_Events_And_Navigation.apk -d /tmp/wambam_apk
          ROOT="/tmp/wambam/WamBam_GDevelop_Alpha_7.9.0"
          PROJECT="$ROOT/Wam Bam Thank u Mam.json"
          REPORT="inspection_level1.txt"
          : > "$REPORT"

          {
            echo "== SOURCE ROOT FILES =="
            find "$ROOT" -maxdepth 2 -type f | sed "s#$ROOT/##" | sort | head -n 250
            echo

            echo "== PROJECT LAYOUTS =="
            jq -r '.layouts[]?.name' "$PROJECT"
            echo

            echo "== LAYOUT OBJECT NAMES =="
            jq -r '.layouts[]? | "LAYOUT: \(.name)" , ((.objects // [])[]?.name), "---"' "$PROJECT" | head -n 500
            echo

            echo "== RELEVANT RESOURCES =="
            jq -r '.resources.resources[]? | select(((.name // "") + " " + (.file // "")) | test("game|level|background|tile|coin|heart|target|move|grid|board|lip|heel|disco|swap"; "i")) | [.name,.file] | @tsv' "$PROJECT" | head -n 250
            echo

            echo "== GAME OVERLAY RELEVANT LINES =="
            grep -nEi 'level ?1|grid|board|tile|coin|heart|moves|target|cols|rows|lip|heel|disco|swap|background' "$ROOT/game-overlay.inline.js" | head -n 300 || true
            echo

            echo "== GAME OVERLAY START =="
            sed -n '1,260p' "$ROOT/game-overlay.inline.js"
            echo

            echo "== INJECTOR =="
            sed -n '1,360p' "$ROOT/inject-alpha-7.9.0.mjs"
            echo

            echo "== APK WEB FILES =="
            find /tmp/wambam_apk -type f | sed 's#/tmp/wambam_apk/##' | grep -Ei 'assets|www|html|js|css|game|background|level' | head -n 300 || true
            echo

            echo "== APK RELEVANT TEXT FILES =="
            grep -RIl -E 'Wam Bam|game-overlay|Level 1|Level1|grid|board|coin|heart|target|moves' /tmp/wambam_apk 2>/dev/null | sed 's#/tmp/wambam_apk/##' | head -n 200 || true
            echo

            echo "== SIGNING / KEY FILES =="
            find . "$ROOT" -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pem' -o -iname '*sign*' -o -iname '*key*' \) | head -n 100 || true
            echo

            echo "== BUILD / PACKAGE FILES =="
            find "$ROOT" -maxdepth 3 -type f \( -name 'package.json' -o -name '*.gradle' -o -name 'gradlew' -o -name 'capacitor.config.*' -o -name 'config.xml' -o -name '*.mjs' \) | sed "s#$ROOT/##" | sort | head -n 200
          } >> "$REPORT"

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "BluStudio Build Bot"
          git config user.email "bigmacblu@gmail.com"
          git add inspection_level1.txt
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Inspect real GDevelop APK Level 1"
            git push origin HEAD:level1-apk-8-0
          fi
