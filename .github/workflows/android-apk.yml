name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "source_parts/**"
      - "android_source_parts/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect current GDevelop APK source
        run: |
          rm -rf /tmp/wambam
          mkdir -p /tmp/wambam
          unzip -q downloads/alpha-7.9.0/WamBam_GDevelop_Alpha_7.9.0_Events_And_Navigation_Source.zip -d /tmp/wambam
          echo "== TOP LEVEL FILES =="
          find /tmp/wambam -maxdepth 3 -type f | sort | head -n 300
          echo "== PROJECT / BUILD FILES =="
          find /tmp/wambam -type f \( -name '*.json' -o -name '*.js' -o -name '*.html' -o -name '*.xml' -o -name '*.gradle' -o -name '*.properties' \) | sort | head -n 500
          echo "== WAM BAM SOURCE MATCHES =="
          grep -RIl -E 'com\.macca\.wambamthankumam|70900|Level 1|Level1|coins|hearts|grid' /tmp/wambam | head -n 250 || true

      - name: Check Level 1 JavaScript
        run: node --check app/src/main/assets/game11.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WamBamThankUMam-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
