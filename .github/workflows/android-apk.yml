name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "source_parts/**"
      - "android_source_parts/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect current GDevelop APK source
        run: |
          rm -rf /tmp/wambam
          mkdir -p /tmp/wambam
          unzip -q downloads/alpha-7.9.0/WamBam_GDevelop_Alpha_7.9.0_Events_And_Navigation_Source.zip -d /tmp/wambam
          ROOT="/tmp/wambam/WamBam_GDevelop_Alpha_7.9.0"
          PROJECT="$ROOT/Wam Bam Thank u Mam.json"
          echo "== PROJECT SIZE =="
          wc -c "$PROJECT"
          echo "== TOP LEVEL KEYS =="
          jq -r 'keys[]' "$PROJECT"
          echo "== LAYOUTS =="
          jq -r '.layouts[]?.name' "$PROJECT"
          echo "== OBJECTS PER LAYOUT =="
          jq -r '.layouts[]? | "LAYOUT: \(.name)\n" + ((.objects // []) | map(.name) | join("\n")) + "\n---"' "$PROJECT"
          echo "== RELEVANT RESOURCES =="
          jq -r '.resources.resources[]? | select(((.name // "") + " " + (.file // "")) | test("game|level|background|tile|coin|heart|target|move|grid|board"; "i")) | [.name,.file] | @tsv' "$PROJECT"
          echo "== PROJECT TEXT MATCHES =="
          grep -oEi '.{0,100}(level ?1|grid|board|tile|coin|heart|moves|target).{0,180}' "$PROJECT" | head -n 300 || true
          echo "== GAME OVERLAY MATCHES =="
          grep -nEi 'level ?1|grid|board|tile|coin|heart|moves|target|cols|rows' "$ROOT/game-overlay.inline.js" | head -n 350 || true
          echo "== 7.9 INJECTOR =="
          sed -n '1,320p' "$ROOT/inject-alpha-7.9.0.mjs"

      - name: Check Level 1 JavaScript
        run: node --check app/src/main/assets/game11.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WamBamThankUMam-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
