name: Build Real Wam Bam Level 1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - level1-apk-8-0
    paths-ignore:
      - "downloads/alpha-8.0.0/**"
      - "inspection_extract/**"
      - "inspection_level1.txt"

permissions:
  contents: write

jobs:
  build-real-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: level1-apk-8-0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools and image converter
        shell: bash
        run: |
          sdkmanager "build-tools;35.0.0"
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Patch the real GDevelop APK
        shell: bash
        run: |
          set -euo pipefail
          OLD_APK="downloads/alpha-7.9.0/WamBam_Alpha_7.9.0_Events_And_Navigation.apk"
          SOURCE_ZIP="downloads/alpha-7.9.0/WamBam_GDevelop_Alpha_7.9.0_Events_And_Navigation_Source.zip"
          STAGE="/tmp/wambam-stage"
          SOURCE="/tmp/wambam-source"
          MODIFIED="/tmp/wambam-modified.apk"

          rm -rf "$STAGE" "$SOURCE" "$MODIFIED" /tmp/wambam-aligned.apk /tmp/wambam-test.keystore
          mkdir -p "$STAGE/assets/www" "$SOURCE"

          cp "$OLD_APK" "$MODIFIED"
          unzip -q "$SOURCE_ZIP" -d "$SOURCE"
          ROOT="$SOURCE/WamBam_GDevelop_Alpha_7.9.0"

          unzip -p "$OLD_APK" assets/www/code2.js > "$STAGE/assets/www/code2.js"
          python3 tools/patch_level1_gdevelop.py "$STAGE/assets/www/code2.js"

          cp "$ROOT/game-overlay.inline.js" /tmp/game-overlay.inline.js
          python3 tools/patch_level1_gdevelop.py /tmp/game-overlay.inline.js

          convert level1_assets/level1_background_11x11.webp -quality 90 "$STAGE/assets/www/game_background_new.jpg"

          node --check "$STAGE/assets/www/code2.js"
          grep -q 'boardRowsForLevel = level => level === 1 ? 11 : 8' "$STAGE/assets/www/code2.js"
          grep -q 'top:21.2, width:74.0, height:62.3' "$STAGE/assets/www/code2.js"
          grep -q 'st.coinsEl = st.level === 1 ? null' "$STAGE/assets/www/code2.js"
          grep -q 'st.livesEl = st.level === 1 ? null' "$STAGE/assets/www/code2.js"

          zip -d "$MODIFIED" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/*.MF' >/dev/null 2>&1 || true
          (
            cd "$STAGE"
            zip -q -u "$MODIFIED" assets/www/code2.js assets/www/game_background_new.jpg
          )

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$MODIFIED" /tmp/wambam-aligned.apk

          keytool -genkeypair -noprompt \
            -keystore /tmp/wambam-test.keystore \
            -storepass wambam8 \
            -keypass wambam8 \
            -alias wambam \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BluStudio Wam Bam Test,O=BluStudio,C=GB"

          mkdir -p downloads/alpha-8.0.0
          OUT="downloads/alpha-8.0.0/WamBam_Alpha_8.0.0_Level1_Grid_Update.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/wambam-test.keystore \
            --ks-pass pass:wambam8 \
            --key-pass pass:wambam8 \
            --out "$OUT" \
            /tmp/wambam-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT"
          unzip -tq "$OUT"
          unzip -p "$OUT" assets/www/code2.js | grep -q 'boardRowsForLevel = level => level === 1 ? 11 : 8'
          unzip -p "$OUT" assets/www/code2.js | grep -q 'top:21.2, width:74.0, height:62.3'
          unzip -p "$OUT" assets/www/code2.js | grep -q 'st.coinsEl = st.level === 1 ? null'
          unzip -p "$OUT" assets/www/code2.js | grep -q 'st.livesEl = st.level === 1 ? null'
          unzip -p "$OUT" assets/www/game_background_new.jpg > /tmp/level1-background-check.jpg
          test -s /tmp/level1-background-check.jpg

          sha256sum "$OUT" > downloads/alpha-8.0.0/SHA256SUMS.txt
          cat > downloads/alpha-8.0.0/RELEASE_NOTES.md <<'EOF'
          # Wam Bam Alpha 8.0.0 Level 1 Update

          This build updates the real GDevelop Android APK used by Wam Bam.

          Changes:
          - New Level 1 background.
          - Level 1 board aligned to the new 11-cell-deep grid artwork.
          - Coins and hearts HUD removed from Level 1.
          - Moves kept in the top-left panel.
          - Level targets moved into the top-right target panel.
          - Game icons resized to sit inside the new grid cells.
          - Faster Level 1 falling-piece handling and batched tile rendering.
          - Lip Laser, Heel Smash, Disco Ball, Swap and Pause areas kept aligned with the new background.

          Install note:
          This APK is test-signed because the original GDevelop signing key is not stored in this repository. If Android reports a signature conflict, uninstall the older Alpha 7.9.0 build before installing this APK.
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-8.0.0-Level1-APK
          path: downloads/alpha-8.0.0/WamBam_Alpha_8.0.0_Level1_Grid_Update.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit tested APK to branch
        shell: bash
        run: |
          git config user.name "BluStudio Build Bot"
          git config user.email "bigmacblu@gmail.com"
          git add downloads/alpha-8.0.0
          if git diff --cached --quiet; then
            echo "APK output already committed"
          else
            git commit -m "Build real Wam Bam Alpha 8.0.0 Level 1 APK"
            git push origin HEAD:level1-apk-8-0
          fi
