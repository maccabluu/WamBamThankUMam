name: Extract Real Wam Bam APK Source

on:
  workflow_dispatch:
  push:
    branches:
      - level1-apk-8-0
    paths-ignore:
      - "inspection_extract/**"
      - "inspection_level1.txt"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: level1-apk-8-0

      - name: Extract useful source files
        shell: bash
        run: |
          set -e
          rm -rf /tmp/wambam /tmp/wambam_apk inspection_extract
          mkdir -p /tmp/wambam /tmp/wambam_apk inspection_extract
          unzip -q downloads/alpha-7.9.0/WamBam_GDevelop_Alpha_7.9.0_Events_And_Navigation_Source.zip -d /tmp/wambam
          unzip -q downloads/alpha-7.9.0/WamBam_Alpha_7.9.0_Events_And_Navigation.apk -d /tmp/wambam_apk
          ROOT="/tmp/wambam/WamBam_GDevelop_Alpha_7.9.0"
          PROJECT="$ROOT/Wam Bam Thank u Mam.json"

          awk 'length($0) < 1200 {print}' "$ROOT/game-overlay.inline.js" > inspection_extract/game-overlay-sanitized.js
          cp "$ROOT/inject-alpha-7.9.0.mjs" inspection_extract/inject-alpha-7.9.0.mjs
          cp "$ROOT/7.9.0_UPDATE.txt" inspection_extract/7.9.0_UPDATE.txt
          jq '.layouts[] | select(.name=="Game")' "$PROJECT" > inspection_extract/game-layout.json
          jq '[.resources.resources[]? | select(((.name // "") + " " + (.file // "")) | test("game|level|background|tile|coin|heart|target|move|grid|board|lip|heel|disco|swap"; "i"))]' "$PROJECT" > inspection_extract/relevant-resources.json

          find /tmp/wambam_apk -type f | sed 's#/tmp/wambam_apk/##' | sort > inspection_extract/apk-files.txt
          grep -RIl -E 'Wam Bam|game-overlay|Level 1|Level1|grid|board|coin|heart|target|moves|game_background_new' /tmp/wambam_apk 2>/dev/null | sed 's#/tmp/wambam_apk/##' | sort > inspection_extract/apk-relevant-paths.txt || true
          find . "$ROOT" -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pem' -o -iname '*sign*' -o -iname '*key*' \) | sort > inspection_extract/signing-files.txt || true

          while IFS= read -r rel; do
            case "$rel" in
              *.js|*.html|*.css|*.json)
                src="/tmp/wambam_apk/$rel"
                size=$(stat -c%s "$src" 2>/dev/null || echo 99999999)
                if [ "$size" -lt 900000 ]; then
                  safe=$(echo "$rel" | tr '/' '_')
                  awk 'length($0) < 1200 {print}' "$src" > "inspection_extract/apk_${safe}"
                fi
                ;;
            esac
          done < inspection_extract/apk-relevant-paths.txt

      - name: Commit extracted inspection files
        shell: bash
        run: |
          git config user.name "BluStudio Build Bot"
          git config user.email "bigmacblu@gmail.com"
          git add inspection_extract
          if git diff --cached --quiet; then
            echo "No extraction changes"
          else
            git commit -m "Extract real GDevelop Level 1 source"
            git push origin HEAD:level1-apk-8-0
          fi
