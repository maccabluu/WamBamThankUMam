name: Wam Bam Alpha 11.4.2 Level 10 Visual Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-4-2.yml'
      - 'release-tools/alpha-11.4.2/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-4-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify repair source and Android SDK
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.4.2/prepare.py
          test -f release-tools/alpha-11.4.2/gameplay-1142.js
          test -f release-tools/alpha-11.4.1/booster-hammer-1141.svg
          for i in 00 01 02; do test -f "release-tools/alpha-11.4.0/frankie-bg.b64.part$i"; done
          node --check release-tools/alpha-11.4.2/gameplay-1142.js
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download exact signed 11.4.0 production base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.4.0/WamBam_Alpha_11.4.0_Frankie_Flash_Boss.apk
          echo '6b6a60f97cc59d884207b0a8b015033aa68dfae0ef68f8b851e6d449afbfd0b9  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          test -f work/assets/www/gameplay-1140.js
          test -f work/assets/www/wam-ui.js
          cp work/assets/www/wam-campaign.js campaign-before.js
          cp work/assets/www/gameplay-1140.js gameplay-1140-before.js

      - name: Apply Level 10 visual, Hammer and popup repairs
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.4.2/prepare.py work/assets/www

      - name: Verify repair without gameplay regression
        run: |
          set -euo pipefail
          cmp -s campaign-before.js work/assets/www/wam-campaign.js
          cmp -s gameplay-1140-before.js work/assets/www/gameplay-1140.js
          node --check work/assets/www/gameplay-1142.js
          grep -Fq '<script src="gameplay-1142.js"></script>' work/assets/www/index.html
          grep -Fq "pause.textContent='Ⅱ'" work/assets/www/gameplay-1142.js
          grep -Fq 'brightenPieces' work/assets/www/gameplay-1142.js
          grep -Fq 'right:84px!important' work/assets/www/gameplay-1142.js
          grep -Fq 'filter:none!important' work/assets/www/gameplay-1142.js
          test -f work/assets/www/icons/booster-hammer-1141.svg
          grep -Fq 'Hammer booster' work/assets/www/icons/booster-hammer-1141.svg
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('work/assets/www/wam-ui.js').read_text()
          assert 'Heel Smash' not in ui
          assert "icons/booster-hammer-1141.svg" in ui
          assert 'z-index:60000' in ui
          bg=Path('work/assets/www/artwork/frankie-level10-bg.jpg').read_bytes()
          assert len(bg)>15000
          assert bg[:3]==b'\xff\xd8\xff'
          print('Verified UI repair, Hammer reward, modal layering and larger Frankie background.')
          PY
          sha256sum work/assets/www/artwork/frankie-level10-bg.jpg > expected-bg.sha256

      - name: Set Android release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>114002',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.4.2',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.4.2-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do test -n "${!value:-}" || exit 1; done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.4.2-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='114002' versionName='11.4.2'" package.txt
          unzip -p WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk assets/www/wam-campaign.js > campaign-packaged.js
          cmp -s campaign-before.js campaign-packaged.js
          unzip -p WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk assets/www/gameplay-1140.js > gameplay-1140-packaged.js
          cmp -s gameplay-1140-before.js gameplay-1140-packaged.js
          unzip -p WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk assets/www/gameplay-1142.js > gameplay-1142-packaged.js
          node --check gameplay-1142-packaged.js
          grep -Fq "pause.textContent='Ⅱ'" gameplay-1142-packaged.js
          unzip -p WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk assets/www/artwork/frankie-level10-bg.jpg > packaged-bg.jpg
          EXPECTED="$(cut -d' ' -f1 expected-bg.sha256)"
          ACTUAL="$(sha256sum packaged-bg.jpg | cut -d' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
          test "$(wc -c < packaged-bg.jpg)" -gt 15000
          unzip -p WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk assets/www/wam-ui.js > wam-ui-packaged.js
          ! grep -Fq 'Heel Smash' wam-ui-packaged.js
          grep -Fq 'booster-hammer-1141.svg' wam-ui-packaged.js
          grep -Fq 'z-index:60000' wam-ui-packaged.js
          sha256sum WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.4.2-Level10-Visual-Hammer-Popup-Fix
          path: |
            WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.4.2
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.4.2
          name: Wam Bam Alpha 11.4.2 - Level 10 Visual Repair
          prerelease: true
          body: |
            Repairs the BlueStacks problems visible in Level 10 and includes the pending Hammer/popup correction.

            Level 10 visual fixes:
            - Replaces the accidentally published 140x240 Frankie fallback with the larger prepared Frankie stage artwork.
            - Removes the darkening filter from the Frankie stage.
            - Brightens the Level 10 board/cells and forces normal piece visibility so icons are no longer almost black.
            - Restores the Level 10 pause symbol and explicitly binds it to the real pause action.
            - Separates the Frankie reaction box from the pause control so they no longer overlap.
            - Keeps the existing 30 moves, boss-health system, boss attacks, targets, arch board and ice mechanics.

            Pending UI fixes included:
            - Heel Smash reward presentation is renamed to Hammer while retaining the real `hammer` inventory key.
            - Completion reward uses the Hammer artwork.
            - Tutorial/completion modal shade is raised above the custom booster strip so popup content and buttons appear over the boosters.

            Preserved:
            - wam-campaign.js is byte-for-byte identical to signed 11.4.0.
            - gameplay-1140.js and Frankie boss mechanics are byte-for-byte identical to signed 11.4.0.
            - Saves/progression and Levels 1-9 are preserved.

            Identity:
            - Package: com.macca.wambamthankumam
            - Android versionCode: 114002
            - Version: 11.4.2
            - Permanent signing certificate unchanged.

            CI verifies build/package/signature and static asset invariants. BlueStacks runtime confirmation is still required.
          files: |
            WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk
            SHA256SUMS.txt
