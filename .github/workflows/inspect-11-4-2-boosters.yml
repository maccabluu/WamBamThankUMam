name: Inspect Wam Bam 11.4.2 Booster APIs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-11-4-2-boosters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current signed production booster APIs
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.4.2/WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk
          echo '8afd8d8fd9c309e461fc70cb5614f5385944a6439f233b4df1f0803835bfd7d8  base.apk' | sha256sum -c -
          unzip -p base.apk assets/www/wam-ui.js > ui.js
          unzip -p base.apk assets/www/wam-engine.js > engine.js
          echo '=== BOOSTER UI REFERENCES ==='
          grep -nE "booster|hammer|rocket|swap|disco|jukebox|shuffle|hint|pause" ui.js | head -n 220 || true
          echo '=== ENGINE METHODS / BOARD STATE ==='
          grep -nE "class Game|shuffle|swap|findMove|remove|clear|resolve|boosters|grid|board|cells|pieces" engine.js | head -n 260 || true
          echo '=== UI CLASS METHODS ==='
          grep -nE "class GameView|render\(|swap\(|pause\(|end\(|clearHint|toast|boosterButtons" ui.js | head -n 220 || true
