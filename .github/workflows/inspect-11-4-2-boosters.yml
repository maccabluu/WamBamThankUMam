name: Inspect Wam Bam 11.4.2 Booster APIs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-11-4-2-boosters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production booster art and campaign API
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.4.2/WamBam_Alpha_11.4.2_Level10_Visual_Hammer_Popup_Fix.apk
          echo '8afd8d8fd9c309e461fc70cb5614f5385944a6439f233b4df1f0803835bfd7d8  base.apk' | sha256sum -c -
          unzip -p base.apk assets/www/wam-campaign.js > campaign.js
          echo '=== MATCHING ART ASSETS ==='
          unzip -l base.apk | awk '{print $4}' | grep -Ei '(^|/)(artwork|icons)/.*(mic|micro|juke|spot|arrow|shuffle|hammer|disco|rocket|booster|row|bow)' | head -n 250 || true
          echo '=== CAMPAIGN PIECES AND BOOSTERS ==='
          grep -nE 'PIECES|BOOSTERS|BOOSTER_LABELS|inventory\(|saveInventory|heel|row|bow|disco' campaign.js | head -n 220 || true
