name: Promote Alpha 11.6.1 as Latest Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-11-6-1-latest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark Alpha 11.6.1 as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v11.6.1             --repo maccabluu/WamBamThankUMam             --prerelease=false             --latest
