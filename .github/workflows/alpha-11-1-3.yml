name: Wam Bam Alpha 11.1.3 PLAY Fix

on:
  push:
    branches: [fix/alpha-11.1.3-play]
    paths:
      - 'release-tools/alpha-11.1.3/**'
      - '.github/workflows/alpha-11-1-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Download verified Alpha 11.1.2 base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.1.2/WamBam_Alpha_11.1.2_Input_Fix.apk
          echo 'e0ae523ac24658d33c9a07d690cc3ef29c4f167dd0d64f595827f66fca7626f3  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work

      - name: Apply PLAY and overlay fixes
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.1.3/prepare.py work/assets/www
          node --check work/assets/www/home-controls-111.js
          node --check work/assets/www/wam-world.js
          node release-tools/alpha-11.1.3/test-home-controls.cjs work/assets/www/home-controls-111.js
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          data=Path('work/assets/www/data.js').read_text()
          payload=data.removeprefix('gdjs.projectData = ').split(';\ngdjs.runtimeGameOptions',1)[0]
          scenes=[layout['name'] for layout in json.loads(payload)['layouts']]
          assert scenes == ['Untitled scene','Level Map','Game','Settings'], scenes
          p=Path('work/apktool.yml'); s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>110103',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.1.3',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Verify packaged control paths
        run: |
          set -euo pipefail
          grep -Fq "if(mounted){controlsRoot=mounted;return}" work/assets/www/home-controls-111.js
          grep -Fq "replaceScene(currentRuntime,'Level Map',false)" work/assets/www/home-controls-111.js
          ! grep -Fq "projectData?.layouts" work/assets/www/home-controls-111.js
          grep -Fq "wam111-blocked" work/assets/www/home-controls-111.js
          grep -Fq "setBlocked(true)" work/assets/www/home-controls-111.js
          grep -Fq "addEventListener('touchend',stop)" work/assets/www/wam-world.js
          grep -Fq "setBlocked?.(false)" work/assets/www/wam-world.js
          grep -Fq "11.1.3" work/assets/www/wam-campaign.js

      - name: Build Android APK
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.1.3-unsigned.apk

      - name: Sign and verify existing Wam Bam identity
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "Missing existing signing secret: $value"; exit 1; }
          done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.1.3-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.1.3_PLAY_Fix.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.1.3_PLAY_Fix.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)" = "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          "$BT/zipalign" -c 4 WamBam_Alpha_11.1.3_PLAY_Fix.apk
          "$BT/aapt" dump badging WamBam_Alpha_11.1.3_PLAY_Fix.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='110103' versionName='11.1.3'" package.txt
          sha256sum WamBam_Alpha_11.1.3_PLAY_Fix.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.1.3-PLAY-Fix
          path: |
            WamBam_Alpha_11.1.3_PLAY_Fix.apk
            SHA256SUMS.txt
            signature.txt
            package.txt
          retention-days: 30
