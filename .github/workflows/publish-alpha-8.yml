name: Publish Wam Bam Alpha 8.0

on:
  workflow_dispatch:
  push:
    branches:
      - alpha-8-release-publish
    paths:
      - ".github/workflows/publish-alpha-8.yml"
      - "release-tools/alpha-8.0/**"
      - "release/alpha-8.0/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Alpha 8.0 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q downloads/alpha-7.9.0/WamBam_Alpha_7.9.0_Events_And_Navigation.apk -d work
          rm -f work/META-INF/*.SF work/META-INF/*.RSA work/META-INF/*.DSA work/META-INF/MANIFEST.MF || true
          base64 -d release-tools/alpha-8.0/background.b64 > work/assets/www/game_background_new.jpg
          test "$(sha256sum work/assets/www/game_background_new.jpg | cut -d' ' -f1)" = "1fb765f37f31e59e9b35c1e2d838ed8e7e0ee427d4c6666a1fbc7496a1d9e9be"
          patch work/assets/www/code2.js < release-tools/alpha-8.0/code2.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/assets/www/data.js")
          s = p.read_text()
          old = '"version":"7.9.0"'
          new = '"version":"8.0.0"'
          if old not in s:
              raise SystemExit("Expected 7.9.0 version marker not found")
          p.write_text(s.replace(old, new, 1))
          PY
          node --check work/assets/www/code2.js
          grep -q 'const ROWS = 11' work/assets/www/code2.js
          grep -q 'const COLS = 8' work/assets/www/code2.js
          grep -q '"version":"8.0.0"' work/assets/www/data.js
          (cd work && zip -qr ../WamBam_Alpha_8.0.0_11_Row_Grid_Updated-unsigned.apk .)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Align, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PASS="$(openssl rand -hex 18)"
          "$BT/zipalign" -f 4 WamBam_Alpha_8.0.0_11_Row_Grid_Updated-unsigned.apk WamBam_Alpha_8.0.0_11_Row_Grid_Updated-aligned.apk
          keytool -genkeypair -noprompt -keystore alpha8.keystore -storepass "$PASS" -keypass "$PASS" -alias alpha8 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BluStudio Wam Bam Alpha 8, O=BluStudio, C=GB"
          "$BT/apksigner" sign --ks alpha8.keystore --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk WamBam_Alpha_8.0.0_11_Row_Grid_Updated-aligned.apk
          "$BT/apksigner" verify --verbose WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk
          sha256sum WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk > WamBam_Alpha_8.0.0_SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-8.0.0-APK
          path: |
            WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk
            WamBam_Alpha_8.0.0_SHA256SUMS.txt
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.0
          name: Wam Bam Alpha 8.0.0
          prerelease: true
          body_path: downloads/alpha-8.0.0/RELEASE_NOTES.md
          files: |
            WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk
            WamBam_Alpha_8.0.0_SHA256SUMS.txt
