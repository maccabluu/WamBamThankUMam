name: Publish Wam Bam Alpha 8.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpha-8.yml"
      - "release-tools/alpha-8.0/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Alpha 8.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q downloads/alpha-7.9.0/WamBam_Alpha_7.9.0_Events_And_Navigation.apk -d work
          rm -rf work/META-INF
          base64 -d release-tools/alpha-8.0/background.b64 > work/assets/www/game_background_new.jpg
          patch work/assets/www/code2.js < release-tools/alpha-8.0/code2.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/assets/www/data.js')
          s=p.read_text()
          s=s.replace('"version":"7.9.0"','"version":"8.0.0"',1)
          p.write_text(s)
          PY
          node --check work/assets/www/code2.js
          (cd work && zip -qr ../WamBam_Alpha_8.0.0_11_Row_Grid_Updated-unsigned.apk .)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Sign with the SAME Wam Bam update key
        shell: bash
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WB_KEYSTORE_B64:-}" ]; then
            echo "ERROR: WB_KEYSTORE_B64 is missing. Alpha 8 must use the same signing key as the installed 7.9 app."
            exit 1
          fi
          sdkmanager "build-tools;35.0.0"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "$WB_KEYSTORE_B64" | base64 -d > wam-bam-release.keystore
          "$BT/zipalign" -f 4 WamBam_Alpha_8.0.0_11_Row_Grid_Updated-unsigned.apk WamBam_Alpha_8.0.0_11_Row_Grid_Updated-aligned.apk
          "$BT/apksigner" sign --ks wam-bam-release.keystore --ks-pass "pass:$WB_KEYSTORE_PASSWORD" --ks-key-alias "$WB_KEY_ALIAS" --key-pass "pass:$WB_KEY_PASSWORD" --out WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk WamBam_Alpha_8.0.0_11_Row_Grid_Updated-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk
          sha256sum WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk > WamBam_Alpha_8.0.0_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-8.0.0-APK
          path: |
            WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk
            WamBam_Alpha_8.0.0_SHA256SUMS.txt

      - name: Publish fixed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.0
          name: Wam Bam Alpha 8.0.0
          prerelease: true
          files: |
            WamBam_Alpha_8.0.0_11_Row_Grid_Updated.apk
            WamBam_Alpha_8.0.0_SHA256SUMS.txt

# Triggered again after adding the permanent Wam Bam signing secrets.
