name: Inspect Wam Bam Navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-nav-11.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - run: |
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.0.4/WamBam_Alpha_11.0.4_Recovery.apk
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work >/dev/null
          echo '===== HOME NAV ====='; sed -n '640,715p' work/assets/www/code0.js
          echo '===== MAP NAV ====='; grep -n "replaceScene\|pushScene" work/assets/www/wam-map.js work/assets/www/code1.js work/assets/www/code2.js | head -100
          echo '===== GAME CLASS ====='; sed -n '90,290p' work/assets/www/wam-ui.js
