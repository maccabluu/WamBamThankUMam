name: Wam Bam Alpha 11.5.6 Level Bar and Booster Strip Fix

on:
  push:
    branches: [wam-11.5.6]
    paths:
      - '.github/workflows/alpha-11-5-6.yml'
      - 'release-tools/alpha-11.5.6/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-5-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wam-11.5.6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 11.5.6 patch sources
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.5.6/prepare.py
          test -f release-tools/alpha-11.5.6/layout-1156.js
          node --check release-tools/alpha-11.5.6/layout-1156.js
          grep -Fq "const MIN=11,MAX=100;" release-tools/alpha-11.5.6/layout-1156.js
          grep -Fq "top:1094px!important" release-tools/alpha-11.5.6/layout-1156.js
          grep -Fq "top:1182px!important" release-tools/alpha-11.5.6/layout-1156.js
          grep -Fq "top:48px!important" release-tools/alpha-11.5.6/layout-1156.js
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download signed Alpha 11.5.5 production lineage
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.5.5/WamBam_Alpha_11.5.5_Levels11-100_Background.apk
          echo '47e103d48fdfd05479a5315bbf610cb1dd66c74b7978e8b8e2293cd012581dbd  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1154.js background-1155.js; do test -f "work/assets/www/$f"; cp "work/assets/www/$f" "$f.before"; done

      - name: Apply Levels 11-100 UI layout fix
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.5.6/prepare.py work/assets/www

      - name: Verify production gameplay remains unchanged
        run: |
          set -euo pipefail
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1154.js background-1155.js; do cmp -s "$f.before" "work/assets/www/$f"; done
          node --check work/assets/www/layout-1156.js
          grep -Fq '<script src="layout-1156.js"></script>' work/assets/www/index.html
          grep -Fq "const MIN=11,MAX=100;" work/assets/www/layout-1156.js
          grep -Fq "top:1094px!important" work/assets/www/layout-1156.js
          grep -Fq "top:1182px!important" work/assets/www/layout-1156.js
          grep -Fq "top:48px!important" work/assets/www/layout-1156.js
          grep -Fq "top:88px!important" work/assets/www/layout-1156.js

      - name: Set Android version 11.5.6
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>115006',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.5.6',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.5.6-unsigned.apk

      - name: Sign permanently and inspect packaged APK
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do test -n "${!value:-}" || exit 1; done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.5.6-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='115006' versionName='11.5.6'" package.txt
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1154.js background-1155.js; do unzip -p WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk "assets/www/$f" > "$f.packaged"; cmp -s "$f.before" "$f.packaged"; done
          unzip -p WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk assets/www/layout-1156.js > layout-1156-packaged.js
          node --check layout-1156-packaged.js
          grep -Fq "top:1094px!important" layout-1156-packaged.js
          grep -Fq "top:48px!important" layout-1156-packaged.js
          sha256sum WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.5.6-Production
          path: |
            WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.5.6
        if: github.ref == 'refs/heads/wam-11.5.6'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.5.6
          target_commitish: wam-11.5.6
          name: Wam Bam Alpha 11.5.6 - Level Bar and Booster Strip
          prerelease: true
          body: |
            Levels 11-100 UI layout correction built directly from signed Alpha 11.5.5.

            - Repositions and cleans up the centre level progress bar so the three stars are visible above the track.
            - Keeps the progress fill and LEVEL number connected to the existing level state.
            - Moves the new Wam Bam booster strip down to the bottom of the 720x1280 stage so it covers the old baked-in lower controls.
            - Moves all booster hit areas and live count numbers with the strip.
            - Level 10 is untouched.
            - Campaign, board shapes, targets, moves, blockers, boosters, saves and progression are unchanged.
            - Package remains com.macca.wambamthankumam.
            - Permanent signing certificate matches Alpha 11.5.5.
            - Version 11.5.6, versionCode 115006.

            Build, signature and packaged-file checks pass in CI. BlueStacks runtime confirmation is still required before calling the visual layout resolved.
          files: |
            WamBam_Alpha_11.5.6_LevelBar_BoosterStrip.apk
            SHA256SUMS.txt
