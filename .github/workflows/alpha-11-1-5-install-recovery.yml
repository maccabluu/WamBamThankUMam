name: Wam Bam Alpha 11.1.5 Install Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-1-5-install-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam1115-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Download trusted Wam Bam builds
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.1.4/WamBam_Alpha_11.1.4_PLAY_Fix.apk
          echo 'd4bdc76d8c5db1f02221922cb35e15a6b32bf1faa3e118cc5b69e0e238117443  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o trusted.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.0.2/WamBam_Alpha_11.0.2_Lights_Guide_And_Locks.apk
          echo '15f73537d9b4f0e4fc041130ae9005f5bb4a91f73acf113ab265bc2955289aa5  trusted.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work

      - name: Raise Android version code only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>111500',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.1.5',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build recovery APK
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.1.5-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify upgrade chain
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "Missing Wam Bam signing secret: $value"; exit 1; }
          done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.1.5-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.1.5_Install_Recovery.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.1.5_Install_Recovery.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          "$BT/apksigner" verify --print-certs trusted.apk > trusted-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          TRUSTED="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' trusted-signature.txt)"
          echo "new=$NEW"
          echo "base=$BASE"
          echo "trusted=$TRUSTED"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          test "$NEW" = "$TRUSTED"
          "$BT/zipalign" -c 4 WamBam_Alpha_11.1.5_Install_Recovery.apk
          "$BT/aapt" dump badging WamBam_Alpha_11.1.5_Install_Recovery.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='111500' versionName='11.1.5'" package.txt
          sha256sum WamBam_Alpha_11.1.5_Install_Recovery.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.1.5-Install-Recovery
          path: |
            WamBam_Alpha_11.1.5_Install_Recovery.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            trusted-signature.txt
            package.txt
          retention-days: 30

      - name: Publish install recovery
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.1.5
          name: Wam Bam Alpha 11.1.5 - Install Recovery
          prerelease: true
          body: |
            Install recovery build for Wam Bam.

            - Same package: com.macca.wambamthankumam
            - Same permanent Wam Bam certificate used by Alpha 11.0.2 and the 9.x update line
            - Certificate SHA-256: d04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1
            - Higher Android versionCode: 111500
            - Game content is unchanged from Alpha 11.1.4
            - Existing saves and app data are retained during a normal in-place update
          files: |
            WamBam_Alpha_11.1.5_Install_Recovery.apk
            SHA256SUMS.txt
