name: Wam Bam Alpha 11.5.4 Goals Containment Fix

on:
  push:
    branches: [wam-11.5.4]
    paths:
      - '.github/workflows/alpha-11-5-4.yml'
      - 'release-tools/alpha-11.5.4/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-5-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wam-11.5.4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 11.5.4 patch sources
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.5.4/prepare.py
          test -f release-tools/alpha-11.5.4/goals-1154.js
          node --check release-tools/alpha-11.5.4/goals-1154.js
          grep -Fq 'goals.appendChild(row)' release-tools/alpha-11.5.4/goals-1154.js
          grep -Fq 'const tops=[70,118,166]' release-tools/alpha-11.5.4/goals-1154.js
          python3 - <<'PY'
          panel_w,panel_h=194,232
          left,width=14,166
          cream_top,cream_bottom=60,8
          tops=[70,118,166]
          row_h=38
          assert left >= 10
          assert left+width <= panel_w-10
          assert min(tops) >= cream_top
          assert max(tops)+row_h <= panel_h-cream_bottom
          print('Geometry check passed: every Level 10 goal row fits inside the cream GOALS area.')
          PY
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download signed Alpha 11.5.3 production lineage
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.5.3/WamBam_Alpha_11.5.3_Goals_Fit_Fix.apk
          echo '13634410edc50f4c642f292ac34cfb0d5933f79bcc0fe160e337f02557669b10  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1152.js goals-1153.js; do test -f "work/assets/www/$f"; cp "work/assets/www/$f" "$f.before"; done
          test -f work/assets/www/artwork/frankie-level10-bg-1150.png
          unzip -p base.apk assets/www/artwork/frankie-level10-bg-1150.png > frankie-before.png
          echo '427bd7ccf5de9fcae2c54bbf788391bff2246ef32f405134f2b9d321a0c92019  frankie-before.png' | sha256sum -c -

      - name: Apply Level 10 goals containment fix only
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.5.4/prepare.py work/assets/www

      - name: Verify production gameplay remains unchanged
        run: |
          set -euo pipefail
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1152.js goals-1153.js; do cmp -s "$f.before" "work/assets/www/$f"; done
          node --check work/assets/www/goals-1154.js
          grep -Fq '<script src="goals-1154.js"></script>' work/assets/www/index.html
          grep -Fq 'goals.appendChild(row)' work/assets/www/goals-1154.js
          grep -Fq 'left:14px!important' work/assets/www/goals-1154.js
          grep -Fq 'width:166px!important' work/assets/www/goals-1154.js
          grep -Fq 'height:38px!important' work/assets/www/goals-1154.js

      - name: Set Android version 11.5.4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>115004',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.5.4',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.5.4-unsigned.apk

      - name: Sign permanently and inspect packaged APK
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do test -n "${!value:-}" || exit 1; done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.5.4-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.5.4_Goals_Contained.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.5.4_Goals_Contained.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.5.4_Goals_Contained.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='115004' versionName='11.5.4'" package.txt
          for f in wam-campaign.js wam-engine.js gameplay-1140.js gameplay-1142.js gameplay-1150.js gameplay-1151.js goals-1152.js goals-1153.js; do unzip -p WamBam_Alpha_11.5.4_Goals_Contained.apk "assets/www/$f" > "$f.packaged"; cmp -s "$f.before" "$f.packaged"; done
          unzip -p WamBam_Alpha_11.5.4_Goals_Contained.apk assets/www/goals-1154.js > goals-1154-packaged.js
          node --check goals-1154-packaged.js
          grep -Fq 'goals.appendChild(row)' goals-1154-packaged.js
          unzip -p WamBam_Alpha_11.5.4_Goals_Contained.apk assets/www/artwork/frankie-level10-bg-1150.png > frankie-packaged.png
          echo '427bd7ccf5de9fcae2c54bbf788391bff2246ef32f405134f2b9d321a0c92019  frankie-packaged.png' | sha256sum -c -
          sha256sum WamBam_Alpha_11.5.4_Goals_Contained.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.5.4-Production
          path: |
            WamBam_Alpha_11.5.4_Goals_Contained.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
          retention-days: 30

      - name: Publish Alpha 11.5.4
        if: github.ref == 'refs/heads/wam-11.5.4'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.5.4
          target_commitish: wam-11.5.4
          name: Wam Bam Alpha 11.5.4 - Goals Containment Fix
          prerelease: true
          body: |
            Level 10 GOALS containment correction built directly from signed Alpha 11.5.3.

            The previous fixes only repositioned the target rows while they were still separate stage elements. This build changes the structure so the three Level 10 target rows are actual children of the GOALS panel. Their positions are now relative to the GOALS panel itself.

            - Rows live inside the GOALS panel DOM container.
            - Row left edge: 14px inside the 194px panel.
            - Row width: 166px.
            - Row height: 38px.
            - Row tops: 70px, 118px and 166px.
            - Icons: 36x36px.
            - Static geometry checks prove each row fits inside the cream area before the APK is built.
            - Goal values, gameplay, board, moves, Frankie attacks, blockers, boosters, saves and progression are unchanged.
            - Package remains com.macca.wambamthankumam.
            - Permanent signing certificate matches Alpha 11.5.3.
            - Version 11.5.4, versionCode 115004.

            Build, signing and packaged-file checks pass in CI. BlueStacks runtime confirmation is still required before calling the visual issue fixed.
          files: |
            WamBam_Alpha_11.5.4_Goals_Contained.apk
            SHA256SUMS.txt
