name: Wam Bam Alpha 11.3.3 Levels 2-9 Visual Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha-11-3-3.yml'
      - 'release-tools/alpha-11.3.3/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wam-11-3-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify patch source and Android SDK
        run: |
          set -euo pipefail
          test -f release-tools/alpha-11.3.3/gameplay-1133.js
          test -f release-tools/alpha-11.3.3/prepare.py
          node --check release-tools/alpha-11.3.3/gameplay-1133.js
          grep -Fq 'const MIN_LEVEL=2;' release-tools/alpha-11.3.3/gameplay-1133.js
          grep -Fq 'const MAX_LEVEL=9;' release-tools/alpha-11.3.3/gameplay-1133.js
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1 || true)"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Download exact signed 11.3.2 production base
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o base.apk https://github.com/maccabluu/WamBamThankUMam/releases/download/v11.3.2/WamBam_Alpha_11.3.2_Booster_Asset_Fix.apk
          echo '584cf24c7e37208293dbe289e984d99ccf53913b290d4fd260b27103db754f59  base.apk' | sha256sum -c -
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d -f base.apk -o work
          test -f work/assets/www/gameplay-1132.js
          test -f work/assets/www/artwork/wambam-level1-bg.jpg
          test -f work/assets/www/artwork/booster-bar-reference-1132.png
          echo '631962144a0a1b1b55bd33ee9957cf130f21baf3fff11270564babe9e687b360  work/assets/www/artwork/booster-bar-reference-1132.png' | sha256sum -c -
          sha256sum work/assets/www/wam-campaign.js > campaign.before.sha

      - name: Apply Levels 2-9 Level 1 presentation
        run: |
          set -euo pipefail
          python3 release-tools/alpha-11.3.3/prepare.py work/assets/www

      - name: Verify UI-only patch and unchanged board definitions
        run: |
          set -euo pipefail
          node --check work/assets/www/gameplay-1133.js
          grep -Fq '<script src="gameplay-1133.js"></script>' work/assets/www/index.html
          grep -Fq "BG_PATH='artwork/wambam-level1-bg.jpg'" work/assets/www/gameplay-1133.js
          grep -Fq "BAR_PATH='artwork/booster-bar-reference-1132.png'" work/assets/www/gameplay-1133.js
          grep -Fq 'const MIN_LEVEL=2;' work/assets/www/gameplay-1133.js
          grep -Fq 'const MAX_LEVEL=9;' work/assets/www/gameplay-1133.js
          grep -Fq 'alignTitleToExistingBoard' work/assets/www/gameplay-1133.js
          sha256sum -c campaign.before.sha

      - name: Set Android release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('work/apktool.yml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^(\s*versionCode:\s*).+$',r'\g<1>113003',s,count=1)
          s,m=re.subn(r'(?m)^(\s*versionName:\s*).+$',r'\g<1>11.3.3',s,count=1)
          assert n==m==1
          p.write_text(s)
          PY

      - name: Build production APK
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          java -jar apktool.jar b work -o WamBam-11.3.3-unsigned.apk

      - name: Sign with permanent Wam Bam identity and verify
        env:
          WB_KEYSTORE_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in WB_KEYSTORE_B64 WB_KEYSTORE_PASSWORD WB_KEY_ALIAS WB_KEY_PASSWORD; do test -n "${!value:-}" || exit 1; done
          printf '%s' "$WB_KEYSTORE_B64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 WamBam-11.3.3-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:WB_KEYSTORE_PASSWORD --ks-key-alias "$WB_KEY_ALIAS" --key-pass env:WB_KEY_PASSWORD --out WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk > signature.txt
          "$BT/apksigner" verify --print-certs base.apk > base-signature.txt
          NEW="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt)"
          BASE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' base-signature.txt)"
          test "$NEW" = 'd04c069c47d1642c83243de681e62bfd1a5c996816ab0c7b15dea82a91338ad1'
          test "$NEW" = "$BASE"
          "$BT/aapt" dump badging WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk > package.txt
          grep -q "package: name='com.macca.wambamthankumam' versionCode='113003' versionName='11.3.3'" package.txt

          # Critical: campaign data in the signed APK must be byte-for-byte identical to 11.3.2.
          unzip -p base.apk assets/www/wam-campaign.js > campaign-base.js
          unzip -p WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk assets/www/wam-campaign.js > campaign-new.js
          cmp campaign-base.js campaign-new.js

          unzip -p WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk assets/www/gameplay-1133.js > packaged-gameplay.js
          node --check packaged-gameplay.js
          grep -Fq 'const MIN_LEVEL=2;' packaged-gameplay.js
          grep -Fq 'const MAX_LEVEL=9;' packaged-gameplay.js
          unzip -p WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk assets/www/index.html | grep -Fq '<script src="gameplay-1133.js"></script>'
          test "$(unzip -Z1 WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk | grep -Fxc 'assets/www/artwork/booster-bar-reference-1132.png')" = 1
          sha256sum WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WamBam-Alpha-11.3.3-Levels-2-9-Visual-Upgrade
          path: |
            WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk
            SHA256SUMS.txt
            signature.txt
            base-signature.txt
            package.txt
            campaign-base.js
            campaign-new.js
          retention-days: 30

      - name: Publish Alpha 11.3.3
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.3.3
          name: Wam Bam Alpha 11.3.3 - Levels 2-9 Visual Upgrade
          prerelease: true
          body: |
            Applies the redesigned Level 1 presentation to Levels 2 through 9 without changing their actual game boards.

            Changes:
            - Levels 2-9 now use the Bam Lounge background/girl presentation from Level 1.
            - Adds the glossy GOALS panel, glossy Moves panel and three-star level progress display to Levels 2-9.
            - Styles each level title, Hint/pause area and board cells to match the Level 1 presentation.
            - Adds the fixed 11.3.2 reference booster strip to Levels 2-9 with the existing four booster hit areas preserved.
            - Level number in the progress tab updates correctly for each level.
            - Existing board geometry is read only so the title can align above it; the patch does not assign new board width, height, left or top values.

            Preserved exactly:
            - wam-campaign.js is byte-for-byte identical to the 11.3.2 production APK.
            - Therefore Levels 2-9 keep their existing board shapes/layouts, rows/columns, move counts, targets, blockers and gameplay configuration.
            - Level 1 gameplay configuration is also unchanged.
            - Saves and campaign progression are retained.

            Identity:
            - Package: com.macca.wambamthankumam
            - Android versionCode: 113003
            - Version: 11.3.3
            - Permanent signing certificate unchanged.

            Build/package/signature/campaign invariants are verified in CI. BlueStacks visual confirmation is still required before calling every level layout runtime-perfect.
          files: |
            WamBam_Alpha_11.3.3_Levels_2-9_Visual_Upgrade.apk
            SHA256SUMS.txt
